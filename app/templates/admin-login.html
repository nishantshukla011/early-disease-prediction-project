            <button type="submit" class="btn">Login</button>

        <p style="margin-top:14px;font-size:0.8em;text-align:center;color:#555;">Demo login only: {{ demo_credentials['admin'][0] }} / {{ demo_credentials['admin'][1] }} (demo credentials, not real authentication)</p>
