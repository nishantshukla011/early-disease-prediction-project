<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login | Early Disease Prediction System</title>
    <link rel="stylesheet" href="/static/css/doc-login.css">
</head>

<body>
    <div class="logo-section">
        <h1 class="top-head">AI-Powered Early Disease Prediction System</h1>
    </div>
    <!-- <h1>Admins Login Form</h1> -->

    <div class="wrap-bg">
        <div class="wrapper">
            <div class="content">
                <span class="icon-close"><ion-icon name="close-outline" onclick="goToHomePage()"></ion-icon></span>
                <div class="form-box login">
                    <h2>Login</h2>
                    <form action="/doctor-login/doctor-dashboard" method="POST">
                        <div class="input-box">
                            <span class="icon"><ion-icon name="person-circle-outline"></ion-icon></span>
                            <input type="text" required name="doctorId" />
                            <label>User Id</label>
                        </div>
                        <div class="input-box">
                            <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                            <input type="password" required name="doctorPass"/>
                            <label>Password</label>
                        </div>
                        <button type="submit" id="loginForm" class="btn">Login</button>
                    </form>
        <p style="margin-top:14px;font-size:0.8em;text-align:center;color:#555;">Demo login only: {{ demo_credentials['doctor'][0] }} / {{ demo_credentials['doctor'][1] }} (demo credentials, not real authentication)</p>
                </div>
            </div>
        </div>
    </div>
</body>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<script src="/static/js/script.js"></script>

</html>
